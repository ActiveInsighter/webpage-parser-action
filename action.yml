name: Webpage Parser
description: Render webpages with Crawl4AI and extract CSS content or public X posts
author: ActiveInsighter
branding:
  icon: globe
  color: blue
inputs:
  url:
    description: One HTTP/HTTPS URL, or up to 10 newline-separated URLs
    required: true
  selector:
    description: CSS selector for the elements to extract
    default: body
  attribute:
    description: Attribute to extract (empty means text; href/src/action become absolute URLs)
    default: ''
  timeout:
    description: Browser navigation and CSS wait timeout in seconds (greater than 0, at most 120)
    default: '30'
  retries:
    description: Retry count for transient network and HTTP errors (0 to 5)
    default: '2'
  mode:
    description: auto detects X URLs; page extracts CSS; x matches the requested status ID
    default: auto
  wait-for:
    description: Optional CSS selector to wait for before extracting
    default: ''
  delay:
    description: Seconds to allow dynamic content to render (0 to 30)
    default: '3'
  max-posts:
    description: Maximum cards with x-scope=visible (1 to 50); target always returns one
    default: '1'
  x-scope:
    description: target matches the URL status ID; visible includes other public cards
    default: target
  transport:
    description: auto tries anonymous HTTP then Chromium; http or browser forces a transport
    default: auto
  save-to:
    description: none or pocketbase (failed writes fail the action)
    default: none
  content-type:
    description: Editable content category, e.g. social_media
    default: social_media
  owner:
    description: PocketBase aw_clients owner ID (required when saving)
    default: ''
  request-id:
    description: Caller correlation ID, up to 128 characters
    default: ''
  options:
    description: JSON overrides for x_scope, transport, save_to, content_type, owner, request_id
    default: '{}'
  pocketbase-url:
    description: PocketBase HTTPS origin
    default: ''
  pocketbase-token:
    description: PocketBase credential; pass from secrets, never from workflow inputs
    default: ''
outputs:
  success:
    description: Whether all crawls and requested database writes succeeded
    value: ${{ steps.parse.outputs.success }}
  record-ids:
    description: JSON array of saved PocketBase record IDs
    value: ${{ steps.parse.outputs.record-ids }}
  request-id:
    description: Caller correlation ID
    value: ${{ steps.parse.outputs.request-id }}
  count:
    description: Number of extracted items
    value: ${{ steps.parse.outputs.count }}
  result-path:
    description: JSON result path relative to the workspace
    value: results/result.json
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - id: parse
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        PARSER_URL: ${{ inputs.url }}
        PARSER_SELECTOR: ${{ inputs.selector }}
        PARSER_ATTRIBUTE: ${{ inputs.attribute }}
        PARSER_TIMEOUT: ${{ inputs.timeout }}
        PARSER_RETRIES: ${{ inputs.retries }}
        PARSER_MODE: ${{ inputs.mode }}
        PARSER_WAIT_FOR: ${{ inputs.wait-for }}
        PARSER_DELAY: ${{ inputs.delay }}
        PARSER_MAX_POSTS: ${{ inputs.max-posts }}
        PARSER_X_SCOPE: ${{ inputs.x-scope }}
        PARSER_TRANSPORT: ${{ inputs.transport }}
        PARSER_SAVE_TO: ${{ inputs.save-to }}
        PARSER_CONTENT_TYPE: ${{ inputs.content-type }}
        PARSER_OWNER: ${{ inputs.owner }}
        PARSER_REQUEST_ID: ${{ inputs.request-id }}
        PARSER_OPTIONS: ${{ inputs.options }}
        POCKETBASE_URL: ${{ inputs.pocketbase-url }}
        POCKETBASE_TOKEN: ${{ inputs.pocketbase-token }}
        CRAWL4AI_NO_CLOUD_NOTICE: '1'
      run: |
        set -euo pipefail
        parser_venv=$(mktemp -d "$RUNNER_TEMP/webpage-parser.XXXXXX")
        trap 'rm -rf "$parser_venv"' EXIT
        python -m venv "$parser_venv"
        "$parser_venv/bin/python" -m pip install --disable-pip-version-check --require-hashes -r "$ACTION_DIR/requirements.txt"
        "$parser_venv/bin/python" -m playwright install --with-deps chromium
        "$parser_venv/bin/python" "$ACTION_DIR/parser.py" \
          --url "$PARSER_URL" --selector "$PARSER_SELECTOR" \
          --attribute "$PARSER_ATTRIBUTE" --timeout "$PARSER_TIMEOUT" \
          --retries "$PARSER_RETRIES" --mode "$PARSER_MODE" \
          --wait-for "$PARSER_WAIT_FOR" --delay "$PARSER_DELAY" \
          --max-posts "$PARSER_MAX_POSTS" \
          --x-scope "$PARSER_X_SCOPE" --transport "$PARSER_TRANSPORT" \
          --save-to "$PARSER_SAVE_TO" --content-type "$PARSER_CONTENT_TYPE" \
          --owner "$PARSER_OWNER" --request-id "$PARSER_REQUEST_ID" \
          --options "$PARSER_OPTIONS"
