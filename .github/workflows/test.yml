name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRAWL4AI_NO_CLOUD_NOTICE: '1'
      POCKETBASE_BINARY: ${{ github.workspace }}/.test-bin/pocketbase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Install pinned PocketBase for isolated migration and permission tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-bin
          curl --fail --location --retry 2 --output .test-bin/pocketbase.zip \
            https://github.com/pocketbase/pocketbase/releases/download/v0.39.10/pocketbase_0.39.10_linux_amd64.zip
          echo '67f68c8041dbb6a35fd7af5997ffc5063a7a7b96bf9df810360788f9e9975408  .test-bin/pocketbase.zip' | sha256sum --check
          unzip -q .test-bin/pocketbase.zip pocketbase -d .test-bin
          chmod +x .test-bin/pocketbase
      - run: python -m unittest discover -s tests -v
