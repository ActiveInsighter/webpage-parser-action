name: Fetch webpage
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: One URL or newline-separated URLs (max 10; empty uses TARGET_URL)
        type: string
        required: false
      selector:
        description: CSS selector (empty uses PARSER_SELECTOR or body)
        type: string
        required: false
      attribute:
        description: Attribute name (empty uses PARSER_ATTRIBUTE or text extraction)
        type: string
        required: false
      timeout:
        description: Browser navigation/wait timeout in seconds (1 to 120)
        type: number
        default: 30
      retries:
        description: Transient error retries (0 to 5)
        type: number
        default: 2
      mode:
        description: Extraction mode
        type: choice
        options:
          - auto
          - page
          - x
        default: auto
      wait_for:
        description: Optional CSS selector to wait for
        type: string
        required: false
      delay:
        description: Wait for dynamic content in seconds (0 to 30)
        type: number
        default: 3
      max_posts:
        description: Maximum X posts per page (1 to 50)
        type: number
        default: 1
      options:
        description: 'JSON: x_scope, transport, save_to, content_type, owner, request_id'
        type: string
        required: false
        default: '{}'
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      selector:
        type: string
        default: body
      attribute:
        type: string
        default: ''
      timeout:
        type: number
        default: 30
      retries:
        type: number
        default: 2
      mode:
        type: string
        default: auto
      wait_for:
        type: string
        default: ''
      delay:
        type: number
        default: 3
      max_posts:
        type: number
        default: 1
      options:
        type: string
        default: '{}'
    secrets:
      WEBPAGE_POCKETBASE_TOKEN:
        required: false
    outputs:
      count:
        value: ${{ jobs.fetch.outputs.count }}
      record_ids:
        value: ${{ jobs.fetch.outputs.record_ids }}
      request_id:
        value: ${{ jobs.fetch.outputs.request_id }}
      success:
        value: ${{ jobs.fetch.outputs.success }}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.parse.outputs.count }}
      record_ids: ${{ steps.parse.outputs.record-ids }}
      request_id: ${{ steps.parse.outputs.request-id }}
      success: ${{ steps.parse.outputs.success }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Fetch and parse
        id: parse
        uses: ./
        with:
          url: ${{ inputs.url || vars.TARGET_URL || 'https://example.com' }}
          selector: ${{ inputs.selector || vars.PARSER_SELECTOR || 'body' }}
          attribute: ${{ inputs.attribute || vars.PARSER_ATTRIBUTE || '' }}
          timeout: ${{ github.event_name != 'schedule' && format('{0}', inputs.timeout) || '30' }}
          retries: ${{ github.event_name != 'schedule' && format('{0}', inputs.retries) || '2' }}
          mode: ${{ inputs.mode || vars.PARSER_MODE || 'auto' }}
          wait-for: ${{ inputs.wait_for || vars.PARSER_WAIT_FOR || '' }}
          delay: ${{ github.event_name != 'schedule' && format('{0}', inputs.delay) || vars.PARSER_DELAY || '3' }}
          max-posts: ${{ github.event_name != 'schedule' && format('{0}', inputs.max_posts) || vars.PARSER_MAX_POSTS || '1' }}
          options: ${{ inputs.options || vars.PARSER_OPTIONS || '{}' }}
          pocketbase-url: ${{ vars.POCKETBASE_URL || 'https://pb.any1.tech' }}
          pocketbase-token: ${{ secrets.WEBPAGE_POCKETBASE_TOKEN }}
      - name: Upload results and browser diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webpage-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
